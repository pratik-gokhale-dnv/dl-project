[project]
name = "fakedet"
version = "0.1.0"
description = "Beyond Detection: do AI image detectors generalize to unseen generators? (CSE 7643, team Finding Pixels)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "pyarrow>=15",
    "pillow>=10",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fakedet = "fakedet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakedet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
